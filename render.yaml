services:
  - type: web
    name: maize-prediction-system-kenya
    runtime: python
    plan: free
    rootDir: .
    buildCommand: python -m zipfile -e maize_prediction_system.zip . && python -m pip install -r maize_prediction/requirements.txt
    startCommand: uvicorn app.main:app --app-dir maize_prediction --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: MAIZE_ADMIN_TOKEN
        generateValue: true
  - type: web
    name: maize-prediction-system-kenya-web
    runtime: static
    plan: free
    rootDir: .
    buildCommand: python -m zipfile -e maize_prediction_system.zip .
    staticPublishPath: build/web
